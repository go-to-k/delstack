name: ci

on:
  push:
    paths-ignore:
      - 'README.md'
    tags-ignore:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
        id: go
      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Unshallow
        run: git fetch --prune --unshallow --tags
      - name: build
        run: make build
      - name: test
        run: make test_view
      - name: Archive code coverage results
        uses: actions/upload-artifact@v6
        with:
          name: code-coverage-report
          path: cover.html

  reviewdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # The action installs the latest golangci-lint unless told otherwise, and
      # golangci-lint bundles its own copy of the Go formatter, independent of the Go
      # toolchain in go.mod, so its formatting rules can move ahead of this repository
      # on their own. Reading the version from .golangci-version keeps CI and
      # `make lint` on the same one. That file holds the version and nothing else:
      # both readers `cat` it as-is, so it cannot carry a comment.
      - name: Read golangci-lint version
        id: golangci_lint_version
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"
      - name: lint
        uses: reviewdog/action-golangci-lint@v2
        with:
          go_version_file: go.mod
          golangci_lint_version: ${{ steps.golangci_lint_version.outputs.version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          level: error
          filter_mode: nofilter
          golangci_lint_flags: '--config=.golangci.yml'
          fail_level: error
